name: CI

# 单测是本项目最重要的安全网：代码绝大多数由 AI Agent 驱动编写，
# 唯一能拦住「看起来对、实际坏了」的就是这 1300+ 项离线测试。
# （刻意不写精确数字：那条注释每加一批用例就得再改一次，而改了往往就忘了。）
#
# 设计要点
# --------
# 1) **完全离线**：conftest.py 里有 autouse 的网络守卫，LLM 用打桩客户端、
#    平台适配器用 respx 拦截、沙盒走 local+force_inline。
#    因此 CI **不需要任何 Secret**（无 LLM Key、无平台 token、无 Docker）。
# 2) **测试 / ruff / mypy 全部阻断**：三者都已清零（2026-10-16），再引入新问题会被拦下。
#    mypy 覆盖 `src/fissue` **与 `tests`**（共 70 个源文件）——测试里的类型问题同样是真问题
#    （这一批就修出两处：自造 `_Ctx` 冒充 `RuntimeContext`、用 `(list.append(x), obj)[1]` 取巧）。
# 3) 版本矩阵取最低支持版本（requires-python >= 3.10）与一个现代版本，
#    保证「声明支持的最老版本」真的有机器在验证。
# 4) **runner 与 action 都钉住**：`runs-on` 写死 `ubuntu-24.04` 而不是 `ubuntu-latest`
#    （该标签 2026-10-19 起迁到 Ubuntu 26，钉住可免于镜像漂移带来的意外）；action 用当前
#    主版本（v4/v5 指向的 Node 20 已被 GitHub 弃用，会被强制跑在 Node 24 上）。
# 5) **另有一个 Windows 任务**：这不是「顺手多跑一遍」。代码里存在成片的 Windows 专属分支
#    （`sandbox` 的 inline 回退、命名管道路径、`os.name == "nt"` 守卫、路径分隔符处理），
#    而它们**在 ubuntu 上一条都不会被执行**。更具体的证据来自 `tests/test_sandbox_forwarder.py`：
#    AF_UNIX 那几条只能在 POSIX 上真跑，于是本机（Windows）覆盖率天然矮一截；
#    反过来 Windows 分支也只有 Windows 机器能验。两个平台各补对方的盲区。
#    只跑测试、不跑覆盖率门槛：覆盖率在 ubuntu 上以单一口径统计，两处各算一套只会互相打架。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.14 是**本机实测跑通全量**的版本，加进来才能把「声明兼容」变成「持续验证」。
        # `requires-python` 不封顶，所以最坏情况（新版本破坏兼容）应当在这里被更早发现，
        # 而不是等用户装上新 Python 才发现。
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装（含 dev 依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 跑离线单测与覆盖率
        # 单条用例的硬超时来自 pyproject 的 `[tool.pytest.ini_options].timeout`（120s）。
        # 这里不重复传 --timeout：单一来源，本地 `pytest -q` 与 CI 口径才一致。
        run: python -m pytest -q -p no:cacheprovider --cov=fissue --cov-report=term

  test-windows:
    name: pytest (windows)
    # 钉 `windows-2022` 而不是 `windows-latest`：理由同上，避免镜像标签漂移。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 只取一个版本：这一任务要回答的是「Windows 分支能不能跑」，不是「各 Python 版本在
          # Windows 上是否一致」——后者由 ubuntu 矩阵负责。多铺一层只会让 CI 时间翻倍。
          python-version: "3.12"
          cache: pip

      - name: 安装（含 dev 依赖）
        # Windows runner 的默认 shell 是 pwsh，多行 run 里要用 PowerShell 语法；
        # 这里刻意只有两条独立命令，两边写法一致，不需要分叉。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 跑离线单测（不带覆盖率门槛）
        # 不传 --cov：覆盖率口径只在 ubuntu 上统计（见文件头第 5 条）。
        # `-p no:cacheprovider` 与 ubuntu 一致，避免 runner 上残留缓存目录。
        # 注意跳过数会出现在 pytest 的收尾行里（如 `13 passed, 8 skipped`）——
        # 「看不见的跳过」和「真的通过」在 CI 里长得一样，所以要让它留在日志里。
        run: python -m pytest -q -p no:cacheprovider

  sandbox-docker:
    name: sandbox (docker)
    runs-on: ubuntu-24.04
    # 为什么要单独一个任务：默认套件承诺**完全离线**，于是 `sandbox.runtime=docker`
    # 那条路径在其它 job 里**一次都不会执行**——测试对 Docker 全是打桩。而挂载构造、
    # `--user` 跟随宿主、`--read-only`、`--network none` 这些参数写错了，单测照样全绿。
    # 本项目反复吃过「只有真机才照得出来」的亏（PostgreSQL / MySQL / Gitee 写操作 /
    # 私有仓库克隆），最该真机验证的沙盒隔离不该再靠打桩。
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装（含 dev 依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 预拉基础镜像
        # 显式拉一次：失败信息会明确落在这一步，而不是混在某个用例的 stderr 里。
        # 用小镜像（alpine）是刻意的——这一层验的是隔离参数，不是验证器生态。
        run: docker pull "${FISSUE_TEST_DOCKER_IMAGE:-alpine:3.20}"

      - name: 跑真容器用例
        env:
          FISSUE_TEST_DOCKER: "1"
        run: python -m pytest -q -p no:cacheprovider tests/test_sandbox_docker.py

  mysql:
    name: store (mysql 8.0)
    runs-on: ubuntu-24.04
    # 为什么要单独一个任务：默认套件跑的是 SQLite，MySQL 独有的坑（utf8mb4 下 3072 字节
    # 索引上限、`TEXT` 只有 64KB、无 `ADD COLUMN IF NOT EXISTS`、`SKIP LOCKED` 要 8.0、
    # `DATETIME` 读回来是 naive）在 SQLite / PostgreSQL 上**一条都不会暴露**。
    # `tests/test_store_mysql.py` 早就写好了，但只在开发机手工跑过一次——改 `store/`
    # 时没有任何机器拦得住回归。库名必须带 `test`：夹具会 `drop_all()`（见该文件头部）。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fissue-root-pw
          MYSQL_DATABASE: fissue_test
          MYSQL_USER: fissue
          MYSQL_PASSWORD: fissue-pw
        ports:
          - 3306:3306
        # 健康检查是必需的：容器「起来了」不等于 mysqld 接受连接，早跑一步就是连接失败。
        # 字符集/排序规则跟随生产配置，否则 utf8mb4 索引长度这条约束验不到。
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ufissue -pfissue-pw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装（含 dev 依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 跑 MySQL 仓储用例
        env:
          FISSUE_TEST_MYSQL_URL: "mysql+pymysql://fissue:fissue-pw@127.0.0.1:3306/fissue_test?charset=utf8mb4"
        # 只跑这一个文件：其余用例假定 SQLite 的「每用例一个临时库」，
        # 切到 MySQL 既慢又会互相污染（见 test_store_mysql.py 头部）。
        run: python -m pytest -q -p no:cacheprovider tests/test_store_mysql.py

  lint:
    name: ruff + mypy
    runs-on: ubuntu-24.04
    # 两者的存量都已在 2026-10-16 清零（ruff：219 处自动 + 30 处手工；mypy：34 处），
    # 所以这里不再有 continue-on-error——新引入的问题会直接把 CI 打红。
    # 旧注释里的「`flush.py::_refresh_labels` 定义冲突」已不成立——现在只有一处定义。
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装（含 dev 依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check src tests scripts

      - name: mypy
        run: python -m mypy src/fissue tests scripts
