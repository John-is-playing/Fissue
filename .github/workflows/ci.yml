name: CI

# 单测是本项目最重要的安全网：代码绝大多数由 AI Agent 驱动编写，
# 唯一能拦住「看起来对、实际坏了」的就是这 1299 项离线测试。
#
# 设计要点
# --------
# 1) **完全离线**：conftest.py 里有 autouse 的网络守卫，LLM 用打桩客户端、
#    平台适配器用 respx 拦截、沙盒走 local+force_inline。
#    因此 CI **不需要任何 Secret**（无 LLM Key、无平台 token、无 Docker）。
# 2) **测试 / ruff / mypy 全部阻断**：三者都已清零（2026-10-16），再引入新问题会被拦下。
#    mypy 覆盖 `src/fissue` **与 `tests`**（共 70 个源文件）——测试里的类型问题同样是真问题
#    （这一批就修出两处：自造 `_Ctx` 冒充 `RuntimeContext`、用 `(list.append(x), obj)[1]` 取巧）。
# 3) 版本矩阵取最低支持版本（requires-python >= 3.10）与一个现代版本，
#    保证「声明支持的最老版本」真的有机器在验证。
# 4) **runner 与 action 都钉住**：`runs-on` 写死 `ubuntu-24.04` 而不是 `ubuntu-latest`
#    （该标签 2026-10-19 起迁到 Ubuntu 26，钉住可免于镜像漂移带来的意外）；action 用当前
#    主版本（v4/v5 指向的 Node 20 已被 GitHub 弃用，会被强制跑在 Node 24 上）。

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.14 是**本机实测跑通全量**的版本，加进来才能把「声明兼容」变成「持续验证」。
        # `requires-python` 不封顶，所以最坏情况（新版本破坏兼容）应当在这里被更早发现，
        # 而不是等用户装上新 Python 才发现。
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装（含 dev 依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 跑离线单测与覆盖率
        # 单条用例的硬超时来自 pyproject 的 `[tool.pytest.ini_options].timeout`（120s）。
        # 这里不重复传 --timeout：单一来源，本地 `pytest -q` 与 CI 口径才一致。
        run: python -m pytest -q -p no:cacheprovider --cov=fissue --cov-report=term

  lint:
    name: ruff + mypy
    runs-on: ubuntu-24.04
    # 两者的存量都已在 2026-10-16 清零（ruff：219 处自动 + 30 处手工；mypy：34 处），
    # 所以这里不再有 continue-on-error——新引入的问题会直接把 CI 打红。
    # 旧注释里的「`flush.py::_refresh_labels` 定义冲突」已不成立——现在只有一处定义。
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装（含 dev 依赖）
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff
        run: python -m ruff check src tests scripts

      - name: mypy
        run: python -m mypy src/fissue tests scripts
