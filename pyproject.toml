[project]
name = "fissue"
version = "1.3.0"
description = "Fissue - 从 GitHub/Gitee/AtomGit/GitLab 检索 Issue/PR，用 AI 大模型评测真实性/重要性/可行性/PR 质量，并在沙盒中自动验证与修复"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fissue" }]
keywords = ["issue", "pull-request", "llm", "ai", "triage", "github", "gitee", "gitlab", "atomgit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.27",
    # 让 TLS 走操作系统信任库：企业代理 / 抓包工具做的 HTTPS 中间人，
    # 其根证书在系统信任库里但不在 certifi 里，装了它就能正常访问。
    "truststore>=0.9",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    # 代码里**没有** `import psycopg`，但它是必需的：SQLAlchemy 按 URL 里的 dialect
    # 动态加载驱动（`postgresql+psycopg://`），静态扫描看不见它。
    "psycopg[binary]>=3.1",
    # 同理，MySQL 走 `mysql+pymysql://`——`import pymysql` 同样不存在于代码里。
    # 纯 Python、无编译依赖，随包装上，「填了连接串就能用」才成立（否则要在
    # 加载期报「驱动不可用」，与「零依赖开箱」的默认值不冲突：默认仍是 SQLite）。
    "pymysql>=1.1",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # 由 `fastapi.templating.Jinja2Templates` 使用，代码里不直接 import。
    "jinja2>=3.1",
]

# 这里**没有**、以及为什么没有（免得有人"补齐"回来）。清理依据见
# `tests/test_packaging.py`——它会断言「声明的每个包要么被代码 import、要么在豁免名单里」：
#   * docker——沙盒要的是**宿主机的 `docker` 命令**（代码用 shutil.which + subprocess
#     调 CLI，见 sandbox/runtime.py），不是 docker 这个 Python SDK。装 SDK 对容器隔离
#     毫无帮助，而真正的依赖（宿主机的 docker）pip 装不了。
#   * apscheduler——常驻服务用的是自己的轮询循环；它只在 logging_setup 的
#     "第三方日志降噪"名单里作为字符串出现过，从未被使用。
#   * tenacity——三处需要重试的地方（LLM 调用、克隆工作区、验证）都是自己写的有限退避。
#   * alembic——表由 `create_all` 建（新表直接建，不需要迁移脚本）。
#   * pydantic-settings——配置是 pydantic `BaseModel` + 自己读 yaml/.env（见 config.py）。

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    # 覆盖率：CI 用它出报告并卡一条**软门**（见 [tool.coverage.report].fail_under）。
    "pytest-cov>=5.0",
    # 单测超时保护：见 [tool.pytest.ini_options].timeout 处的说明。
    # 没有它时，「真实网络请求被静默重试到超时」这类故障表现为 pytest **假死**——
    # 不出结果、不报错，只能干等到 CI 的 job 上限才看到一句 cancelled。
    "pytest-timeout>=2.3",
    # 本地提交前钩子（.pre-commit-config.yaml 走 language: system，用的是本环境里的
    # ruff / mypy，因此这套钩子与 CI 跑的是同一版本——见 CONTRIBUTING.md 的教训：
    # 「没在本地跑 mypy 就会在 CI 上红」）。
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/John-is-playing/Fissue"
Repository = "https://github.com/John-is-playing/Fissue"
Issues = "https://github.com/John-is-playing/Fissue/issues"
Changelog = "https://github.com/John-is-playing/Fissue/blob/main/CHANGELOG.md"
Documentation = "https://github.com/John-is-playing/Fissue/blob/main/docs/USAGE.md"


[project.scripts]
fissue = "fissue.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fissue"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 单条测试的硬超时（秒）。这个项目踩过一次「pytest 假死」：conftest 的网络守卫只放行
# localhost，而本机代理恰好也在 localhost，于是 httpx 的真实请求既没被守卫拦下、也没被
# respx 拦截，只是静默重试到超时——表现为整个测试进程挂住、不报任何错。
# 有了这条，同样的故障会在 120s 内变成一条明确的 `Timeout`，直接指到卡住的用例。
# 取 120 而不是更短：本仓库最慢的用例（e2e 全链路）在 CI 上约 20~30s，留足余量。
# 需要临时放宽的用例用 `@pytest.mark.timeout(N)` 单独覆盖。
timeout = 120

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# 目标平台钉成 linux，与 CI（ubuntu-24.04）一致。
# 不钉的话，在 Windows 上跑 mypy 会因为 `os.flock` / `os.killpg` / `socket.AF_UNIX`
# 这些 POSIX-only 接口报十余处「Module has no attribute」，而 CI 上一条都不报——
# 本机与 CI 结论相反时，人只会怀疑工具坏了，或者用 `# type: ignore` 把真问题盖掉。
platform = "linux"

[tool.coverage.report]
# 覆盖率**软门**：略低于当前实测值，只为拦住「覆盖率倒退」，不追求一步到位的高门槛。
# 只有真去收集覆盖率时才生效（CI 的 test job 用 `--cov=fissue` 触发）；
# 本地 `pytest -q` 不带 --cov，因此这条不会影响日常跑测。
fail_under = 83       # 当前全量测试实测 85.9%，预留约 3 个百分点的波动空间
show_missing = true
