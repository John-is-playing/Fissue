[project]
name = "fissue"
version = "1.0.0"
description = "Fissue - 从 GitHub/Gitee/AtomGit/GitLab 检索 Issue/PR，用 AI 大模型评测真实性/重要性/可行性/PR 质量，并在沙盒中自动验证与修复"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fissue" }]
keywords = ["issue", "pull-request", "llm", "ai", "triage", "github", "gitee", "gitlab", "atomgit"]

dependencies = [
    "httpx>=0.27",
    # 让 TLS 走操作系统信任库：企业代理 / 抓包工具做的 HTTPS 中间人，
    # 其根证书在系统信任库里但不在 certifi 里，装了它就能正常访问。
    "truststore>=0.9",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    # 代码里**没有** `import psycopg`，但它是必需的：SQLAlchemy 按 URL 里的 dialect
    # 动态加载驱动（`postgresql+psycopg://`），静态扫描看不见它。
    "psycopg[binary]>=3.1",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # 由 `fastapi.templating.Jinja2Templates` 使用，代码里不直接 import。
    "jinja2>=3.1",
]

# 这里**没有**、以及为什么没有（免得有人"补齐"回来）。清理依据见
# `tests/test_packaging.py`——它会断言「声明的每个包要么被代码 import、要么在豁免名单里」：
#   * docker——沙盒要的是**宿主机的 `docker` 命令**（代码用 shutil.which + subprocess
#     调 CLI，见 sandbox/runtime.py），不是 docker 这个 Python SDK。装 SDK 对容器隔离
#     毫无帮助，而真正的依赖（宿主机的 docker）pip 装不了。
#   * apscheduler——常驻服务用的是自己的轮询循环；它只在 logging_setup 的
#     "第三方日志降噪"名单里作为字符串出现过，从未被使用。
#   * tenacity——三处需要重试的地方（LLM 调用、克隆工作区、验证）都是自己写的有限退避。
#   * alembic——表由 `create_all` 建（新表直接建，不需要迁移脚本）。
#   * pydantic-settings——配置是 pydantic `BaseModel` + 自己读 yaml/.env（见 config.py）。

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
fissue = "fissue.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fissue"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
